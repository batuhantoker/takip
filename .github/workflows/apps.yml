name: Apps

# The apps load takip.dev, so a web change never needs a rebuild: this runs only when a shell changes
# (a quick check), for an apps-v* tag (signed builds and a draft release), or by hand.
on:
  push:
    branches: [dev, master]
    tags: ["apps-v*"]
    paths: ["apps/mobile/**", "apps/desktop/**", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["apps/mobile/**", "apps/desktop/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/apps-v') }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # paths-filter reads a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop-matrix: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile: ["apps/mobile/**", ".github/workflows/apps.yml"]
            desktop: ["apps/desktop/**", ".github/workflows/apps.yml"]
      # A shell change is checked on Linux alone; Windows and macOS build for releases and manual runs.
      - id: matrix
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/apps-v') }}
        run: |
          linux='{"os":"ubuntu-latest","target":"linux"}'
          if [ "$FULL" = true ]; then m="[$linux,{\"os\":\"windows-latest\",\"target\":\"win\"},{\"os\":\"macos-latest\",\"target\":\"mac\"}]"; else m="[$linux]"; fi
          echo "include=$m" >> "$GITHUB_OUTPUT"

  versions:
    if: startsWith(github.ref, 'refs/tags/apps-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches both apps' versions
        run: |
          tag=${GITHUB_REF_NAME#apps-v}
          for app in mobile desktop; do
            v=$(node -p "require('./apps/$app/package.json').version")
            [ "$v" = "$tag" ] || { echo "apps/$app is $v, the tag says $tag"; exit 1; }
          done

  android:
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/apps-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      # Capacitor 8 wants Node 22+ and JDK 21.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --workspaces=false
      - run: node tools/sync-native.mjs && npx cap sync android

      - name: Signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/signing.properties"
          echo "TAKIP_ANDROID_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Debug build
        if: env.RELEASE != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --console=plain

      - name: Release build (APK for takip.dev, bundle for Google Play)
        if: env.RELEASE == 'true'
        working-directory: apps/mobile/android
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "Add the ANDROID_* secrets (docs/runbooks/app-stores.md) to sign a release."; exit 1; }
          ./gradlew assembleRelease bundleRelease --console=plain
          v=$(node -p "require('../package.json').version")
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/TAKIP-$v-android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../out/TAKIP-$v-android.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/mobile/out/*
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    needs: [changes]
    # macOS minutes cost ten times Linux ones: releases and manual runs only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/apps-v')
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --workspaces=false
      - run: node tools/sync-native.mjs && npx cap sync ios

      - name: Simulator build (no signing)
        if: env.ASC_KEY_P8_BASE64 == ''
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      # Archives with automatic signing through an App Store Connect API key, then uploads to TestFlight.
      - name: Archive and upload to App Store Connect
        if: env.ASC_KEY_P8_BASE64 != ''
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TAKIP.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" "${auth[@]}" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TAKIP.xcarchive" -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}"

  desktop:
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/apps-v')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.desktop-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --workspaces=false && npm test
      # electron-builder tries to sign once CSC_LINK exists, even empty, so it is set only when there is a certificate.
      - name: Signing
        env:
          TARGET: ${{ matrix.target }}
        run: |
          link=; pass=
          if [ "$TARGET" = mac ]; then link=$MAC_CSC_LINK; pass=$MAC_CSC_KEY_PASSWORD; fi
          if [ "$TARGET" = win ]; then link=$WIN_CSC_LINK; pass=$WIN_CSC_KEY_PASSWORD; fi
          if [ -n "$link" ]; then
            { echo "CSC_LINK=$link"; echo "CSC_KEY_PASSWORD=$pass"; } >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
      - run: npm run dist:${{ matrix.target }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/dist/TAKIP-*.dmg
            apps/desktop/dist/TAKIP-*.exe
            apps/desktop/dist/TAKIP-*.AppImage
            apps/desktop/dist/TAKIP-*.deb
          if-no-files-found: error

  # A draft for review: nothing reaches takip.dev until tools/native/publish.mjs is run by hand.
  release:
    needs: [versions, android, desktop]
    if: startsWith(github.ref, 'refs/tags/apps-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f -name 'TAKIP-*')
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Apps ${GITHUB_REF_NAME#apps-v}" \
            --notes "Built from ${GITHUB_SHA::7}. Review, then publish to takip.dev with: node tools/native/publish.mjs collect --release $GITHUB_REF_NAME && node tools/native/publish.mjs push" \
            "${files[@]}"
