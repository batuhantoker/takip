name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same major as the Dockerfile; better-sqlite3 needs >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (web)
        run: npx tsc --noEmit

      - name: Typecheck (api)
        run: npm run typecheck -w @takip/api

      - name: Test
        run: npx vitest run

  publish:
    needs: checks
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    # Two quick pushes to master must not race to overwrite the `latest` tag.
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
