name: takip
services:
  takip:
    # Builds locally from the Dockerfile so you always run the cloned code.
    # To use the prebuilt image instead, replace the `build:` block below with
    # `image: ghcr.io/batuhantoker/takip:latest`.
    build:
      context: .
      dockerfile: Dockerfile
      # Baked into the build, so env_file below can't set them.
      args:
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_PANEL: ${NEXT_PUBLIC_ADSENSE_SLOT_PANEL:-}
        NEXT_PUBLIC_ADSENSE_SLOT_PAGE: ${NEXT_PUBLIC_ADSENSE_SLOT_PAGE:-}
    container_name: takip
    # Host port is configurable via TAKIP_PORT in .env (defaults to 3000).
    ports:
      - "${TAKIP_PORT:-${OSIRIS_PORT:-3000}}:3000"
    # Optional API keys / scanner backend — copy .env.template to .env and
    # fill in what you need. Missing file is ignored (keyless feeds still work).
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TAKIP_ARCHIVE_DIR=/app/data/archive
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Reference map layers (data/reference/README.md). Gitignored, so copy them to the server;
    # without them /api/reference reports nothing installed and the layers stay hidden.
    volumes:
      - ./data/reference:/app/data/reference:ro
      # Raw feed archive (replay-database.md §7.1). Must be writable by uid 1001.
      - ./data/archive:/app/data/archive
    restart: unless-stopped
    networks:
      - default

  takip-cache:
    image: nginx:alpine
    container_name: takip-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - takip
    restart: unless-stopped
    networks:
      - default

  takip-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: takip-intel
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - default

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: takip
  author: batuhantoker
  developer: batuhantoker
  category: Network
  description:
    en_us: >-
      TAKIP is a production-grade open-source OSINT situational-awareness
      dashboard. It aggregates real-time global intelligence across aviation,
      maritime, CCTV networks, seismic activity, wildfires, news feeds,
      weather, space weather, cyber threats (CVEs) and conflict zones into a
      single GPU-accelerated MapLibre interface. Most features work with no
      API keys.
  tagline:
    en_us: Real-time global OSINT intelligence dashboard
  title:
    en_us: TAKIP
  icon: https://raw.githubusercontent.com/batuhantoker/takip/master/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/batuhantoker/takip/master/public/og-image.png
  screenshot_link:
    - https://raw.githubusercontent.com/batuhantoker/takip/master/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL, e.g. http://scanner:7700"
    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret (must match backend OSIRIS_KEY)."
    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key for active-fire data."
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for maritime vessel tracking."
    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Optional) OpenSky OAuth2 client id for higher aircraft rate limits."
    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Optional) OpenSky OAuth2 client secret."
    - container: N2YO_API_KEY
      description:
        en_us: "(Optional) N2YO key for satellite tracking."
  ports:
    - container: "3000"
      description:
        en_us: "Web UI (HTTP)."
